<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ thống đang được nâng cấp</title>

<!-- Fonts & FontAwesome Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --primary: #3b82f6;
    --primary-glow: #60a5fa;
    --accent: #2563eb;
    --bg-dark: #030712;
    --card-bg: rgba(15, 23, 42, 0.65);
    --border: rgba(255, 255, 255, 0.1);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--bg-dark);
    color: var(--text-main);
    overflow-x: hidden;
    position: relative;
    padding: 20px;
  }

  /* Đèn nền phát sáng dải màu sinh động */
  .bg-glow-1 {
    position: absolute;
    top: 15%;
    left: 20%;
    width: 450px;
    height: 450px;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.35), transparent 70%);
    filter: blur(100px);
    animation: float1 10s infinite alternate ease-in-out;
    z-index: 0;
  }

  .bg-glow-2 {
    position: absolute;
    bottom: 15%;
    right: 20%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(147, 51, 234, 0.25), transparent 70%);
    filter: blur(100px);
    animation: float2 12s infinite alternate ease-in-out;
    z-index: 0;
  }

  @keyframes float1 {
    from { transform: translate(-50px, -50px) scale(1); }
    to { transform: translate(50px, 50px) scale(1.1); }
  }

  @keyframes float2 {
    from { transform: translate(40px, 30px) scale(1.1); }
    to { transform: translate(-40px, -40px) scale(0.9); }
  }

  /* Khung Container Kính Mờ (Glassmorphism) */
  .container {
    position: relative;
    z-index: 10;
    max-width: 680px;
    width: 100%;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 48px 36px;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(59, 130, 246, 0.15);
  }

  /* Logo */
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #60a5fa, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 24px;
    text-transform: uppercase;
  }

  /* Tiêu đề chính */
  h1 {
    font-size: 2.25rem;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -0.5px;
    color: var(--text-main);
    margin-bottom: 12px;
  }

  /* Mô tả */
  .subtitle {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--text-muted);
    max-width: 500px;
    margin: 0 auto 28px;
  }

  /* Khung ảnh GIF Robot */
  .robot-container {
    position: relative;
    display: inline-block;
    margin-bottom: 24px;
  }

  .robot-gif {
    width: 240px;
    height: auto;
    border-radius: 20px;
    background: #090d16;
    padding: 10px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(59, 130, 246, 0.2);
    transition: transform 0.4s ease;
  }

  .robot-container:hover .robot-gif {
    transform: translateY(-5px) scale(1.02);
  }

  /* Trạng thái công việc */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(59, 130, 246, 0.1);
    border: 1px solid rgba(96, 165, 250, 0.25);
    padding: 8px 20px;
    border-radius: 99px;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--primary-glow);
    margin-bottom: 24px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 10px #38bdf8;
    animation: pulse 1.6s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* Bánh răng xoay mượt */
  .gear-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    color: var(--primary-glow);
  }

  .gear {
    font-size: 1.5rem;
    animation: spin 6s linear infinite;
  }

  .gear.reverse {
    font-size: 1.1rem;
    animation: spin-reverse 4s linear infinite;
    color: #a855f7;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes spin-reverse {
    from { transform: rotate(0deg); }
    to { transform: rotate(-360deg); }
  }

  /* Thanh tiến trình loading */
  .progress-container {
    width: 100%;
    max-width: 380px;
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 99px;
    overflow: hidden;
    margin: 0 auto 32px;
    position: relative;
  }

  .progress {
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, #3b82f6, #a855f7);
    border-radius: 99px;
    animation: loading 2.5s infinite ease-in-out;
    box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
  }

  @keyframes loading {
    0% { transform: translateX(-100%); width: 30%; }
    50% { width: 60%; }
    100% { transform: translateX(350%); width: 30%; }
  }

  /* Nút quay về trang chủ */
  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 32px;
    border-radius: 99px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .home-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 30px -5px rgba(59, 130, 246, 0.7);
    background: linear-gradient(135deg, #60a5fa, var(--primary));
  }

  .home-btn i {
    transition: transform 0.3s ease;
  }

  .home-btn:hover i {
    transform: translateX(-4px);
  }

  /* Thông tin liên hệ */
  .contact {
    font-size: 0.875rem;
    color: var(--text-muted);
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 16px;
  }

  .contact a {
    color: var(--primary-glow);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .contact a:hover {
    color: #ffffff;
    text-decoration: underline;
  }

  /* Responsive */
  @media (max-width: 640px) {
    .container {
      padding: 36px 20px;
      border-radius: 20px;
    }
    h1 {
      font-size: 1.75rem;
    }
    .subtitle {
      font-size: 0.9rem;
    }
    .robot-gif {
      width: 190px;
    }
  }
</style>
</head>

<body>

<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<div class="container">
  <!-- Brand / Logo -->
  <div class="logo">
    <i class="fa-solid fa-cube"></i> TÊN CÔNG TY
  </div>

  <!-- Heading -->
  <h1>Hệ thống đang được nâng cấp</h1>

  <!-- Subtitle -->
  <p class="subtitle">
    Robot kỹ thuật đang tối ưu hóa trải nghiệm của bạn.<br>
    Chúng tôi sẽ sớm trở lại với phiên bản mượt mà hơn! 🚀
  </p>

  <!-- Robot GIF -->
  <div class="robot-container">
    <img src="https://cdn.dribbble.com/userupload/24243089/file/still-4be461cae2539284d0bb2eb61757dee6.gif" 
         alt="Robot đang bảo trì" 
         class="robot-gif">
  </div>

  <!-- Status Badge -->
  <div>
    <div class="status">
      <span class="dot"></span>
      Đang bảo trì – Robot đang hoàn thiện
    </div>
  </div>

  <!-- Animated Gears -->
  <div class="gear-container">
    <i class="fa-solid fa-gear gear"></i>
    <i class="fa-solid fa-gear gear reverse"></i>
    <i class="fa-solid fa-gear gear"></i>
  </div>

  <!-- Progress Bar -->
  <div class="progress-container">
    <div class="progress"></div>
  </div>

  <!-- Action Button -->
  <a href="trangchu.html" class="home-btn">
    <i class="fa-solid fa-arrow-left"></i> Quay về Trang chủ
  </a>

  <!-- Contact Section -->
  <div class="contact">
    <span>Cần hỗ trợ gấp?</span>
    <a href="mailto:support@tencongty.com"><i class="fa-regular fa-envelope"></i> support@tencongty.com</a>
    <span>•</span>
    <a href="tel:+84987654321"><i class="fa-solid fa-phone"></i> 0987 654 321</a>
  </div>
</div>

</body>
</html>
