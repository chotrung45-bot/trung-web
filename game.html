<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire ULTRA REAL - Siêu Chi Tiết</title>
    <style>
        body { 
            margin: 0; padding: 0; background: #000; overflow: hidden; 
            font-family: 'Courier New', monospace; color: #fff; 
        }
        canvas { display: block; cursor: none; }
        #ui { 
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0,0,0,0.85); padding: 15px; border-radius: 10px; 
            border: 2px solid #ff4444; font-size: 18px; backdrop-filter: blur(10px);
        }
        #ammo { 
            position: absolute; bottom: 30px; right: 30px; z-index: 10;
            background: rgba(0,0,0,0.9); padding: 15px; border-radius: 15px; 
            border: 2px solid #ffd700; font-size: 20px; text-align: center; backdrop-filter: blur(10px);
        }
        #minimap { 
            position: absolute; top: 20px; right: 20px; z-index: 10;
            width: 150px; height: 150px; background: rgba(0,0,0,0.7); 
            border: 2px solid #00ff00; border-radius: 50%; cursor: pointer;
        }
        #killfeed { 
            position: absolute; right: 200px; top: 20px; z-index: 10;
            max-width: 300px; font-size: 14px;
        }
        .kill { color: #ff4444; margin: 5px 0; opacity: 0; animation: fadeInOut 3s; }
        @keyframes fadeInOut { 0%,100%{opacity:0;} 20%{opacity:1;} }
        #menu { 
            position: absolute; inset: 0; background: radial-gradient(circle, rgba(0,0,0,0.98), rgba(20,0,0,0.95)); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 100; font-size: 32px; text-align: center;
        }
        button { 
            padding: 25px 50px; font-size: 32px; margin: 20px; 
            background: linear-gradient(45deg, #ff4444, #ff8800, #ffff00); border: none; 
            color: #000; border-radius: 20px; cursor: pointer; box-shadow: 0 10px 30px rgba(255,68,68,0.6);
            transition: all 0.4s; font-weight: bold;
        }
        button:hover { transform: scale(1.1) rotate(2deg); box-shadow: 0 15px 40px rgba(255,100,100,0.9); }
        @media (max-width: 768px) { 
            #ui, #minimap, #ammo, #killfeed { font-size: 14px; } 
            #minimap { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1 style="font-size: 5em; margin: 0; text-shadow: 0 0 30px #ff4444, 0 0 60px #ff8800;">FREE FIRE ULTRA</h1>
        <p style="font-size: 1.8em; margin: 30px; text-shadow: 0 0 10px #fff;">Phiên bản ULTRA CHÂN THỰC - Night cycle, mưa, nhà cửa, lựu đạn, killfeed!</p>
        <button onclick="startGame()">💥 BẮT ĐẦU CUỘC CHIẾN ULTRA 💥</button>
        <p style="font-size: 1.4em; opacity: 0.9;">WASD di chuyển | Chuột nhắm bắn | R: Lựu đạn | Loot up gear</p>
    </div>

    <div id="ui">
        <div>💀 Score: <span id="score">0</span></div>
        <div>❤️ HP: <span id="hp">100</span>/100</div>
        <div>🔫 <span id="weaponName">Pistol</span></div>
        <div>⛈️ Weather: <span id="weather">Sunny</span></div>
    </div>
    <div id="ammo">
        Đạn: <span id="bulletsLeft">12</span>/<span id="magazine">12</span><br>
        <small>R: Grenade</small>
    </div>
    <div id="killfeed"></div>

    <canvas id="canvas" width="1920" height="1080"></canvas>
    <canvas id="minimap" width="150" height="150"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const minimap = document.getElementById('minimap');
        const mctx = minimap.getContext('2d');

        let cw = 1920, ch = 1080, scale = 1;
        function resize() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = window.innerHeight;
            scale = Math.min(cw/1920, ch/1080);
            ctx.scale(scale, scale);
        }
        resize();
        window.addEventListener('resize', resize);

        // Game state nâng cao
        let player, camera, enemies = [], bullets = [], particles = [], loots = [], trees = [], buildings = [], grenades = [], rain = [];
        let keys = {}, mouse = {x:0, y:0, down: false}, score = 0, gameRunning = false;
        let time = 0, shake = 0, lastShot = 0, mag = 12, ammoInMag = 12, grenadesLeft = 3;
        let nightCycle = 0, weather = 'sunny', killfeed = [];

        // Weapons
        const weapons = [
            {name: "Pistol", dmg: 25, rate: 250, mag: 15, speed: 16, color: "#FFD700", recoil: 0.08, soundFreq: 800},
            {name: "AK-47", dmg: 40, rate: 90, mag: 35, speed: 20, color: "#FF4500", recoil: 0.25, soundFreq: 120},
            {name: "Shotgun", dmg: 15, rate: 550, mag: 10, speed: 14, color: "#8B4513", recoil: 0.35, soundFreq: 60, pellets: 8}
        ];
        let currentWeapon = 0;

        // Audio
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type='sawtooth', dur=0.12, vol=0.25, pitchVar=50) {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = type; o.frequency.value = freq + (Math.random()-0.5)*pitchVar;
            g.gain.setValueAtTime(vol, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + dur);
        }

        // Particle ULTRA (rain, fire, smoke, blood, sparks)
        class Particle {
            constructor(x, y, vx, vy, color, size=3, life=50, fade=true, glow=false, gravity=0.03, rot=0) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                this.color = color; this.size = size; this.life = life; this.maxLife = life;
                this.fade = fade; this.glow = glow; this.gravity = gravity; this.rot = rot; this.rotSpeed = (Math.random()-0.5)*0.2;
            }
            update() {
                this.vx *= 0.97; this.vy *= 0.97; this.vy += this.gravity;
                this.x += this.vx; this.y += this.vy; this.rot += this.rotSpeed; this.life--;
            }
            draw() {
                let alpha = this.fade ? this.life / this.maxLife : 1;
                let sx = this.x - camera.x, sy = this.y - camera.y;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(sx, sy);
                ctx.rotate(this.rot);
                if (this.glow) {
                    ctx.shadowColor = this.color; ctx.shadowBlur = 20;
                }
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                ctx.shadowBlur = 0;
                ctx.restore();
            }
        }

        // Tree chi tiết hơn
        class Tree {
            constructor(x, y) {
                this.x = x; this.y = y; this.size = 45 + Math.random()*25; this.height = 140 + Math.random()*80;
                this.branches = 3 + Math.floor(Math.random()*3);
            }
            draw() {
                let sx = this.x - camera.x, sy = this.y - camera.y;
                // Shadow chi tiết
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath();
                ctx.ellipse(sx + 25, sy + this.height/2 + 20, this.size/1.4, 20, 0.1, 0, Math.PI*2);
                ctx.fill();

                // Trunk với texture
                let trunkGrad = ctx.createLinearGradient(sx + this.size/3, sy, sx + this.size/3, sy + this.height);
                trunkGrad.addColorStop(0, '#A0522D'); trunkGrad.addColorStop(0.5, '#8B4513'); trunkGrad.addColorStop(1, '#654321');
                ctx.fillStyle = trunkGrad;
                ctx.fillRect(sx + this.size/4, sy + this.height/4, this.size/2.5, this.height*0.75);
                // Knots
                ctx.fillStyle = '#5D4037'; 
                for(let i=0; i<3; i++) ctx.beginPath(); ctx.arc(sx + this.size/3 + Math.random()*10, sy + this.height/4 + i*30, 3, 0, Math.PI*2); ctx.fill();

                // Leaves layers (3 layers cho depth)
                for(let layer=0; layer<3; layer++) {
                    let grad = ctx.createRadialGradient(sx + this.size/2 + (layer-1)*5, sy + this.height/4 + layer*5, 0, sx + this.size/2 + (layer-1)*5, sy + this.height/4 + layer*5, this.size + layer*5);
                    grad.addColorStop(0, '#32CD32'); grad.addColorStop(0.4, '#228B22'); grad.addColorStop(0.8, '#006400'); grad.addColorStop(1, '#004d00');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(sx + this.size/2 + (layer-1)*3, sy + this.height/4 + layer*3, this.size + layer*8, 0, Math.PI*2);
                    ctx.fill();
                }
                // Branches
                ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 4; ctx.lineCap = 'round';
                for(let i=0; i<this.branches; i++) {
                    ctx.beginPath();
                    ctx.moveTo(sx + this.size/2.5, sy + this.height/3 + i*15);
                    ctx.lineTo(sx + this.size/2.5 + 30*Math.cos(i), sy + this.height/3 + i*15 + 25*Math.sin(i));
                    ctx.stroke();
                }
            }
            collides(px, py, r) { return Math.hypot(px - this.x, py - this.y) < this.size + r; }
        }

        // Building (nhà cửa)
        class Building {
            constructor(x, y) {
                this.x = x; this.y = y; this.width = 80 + Math.random()*60; this.height = 100 + Math.random()*100;
                this.doors = 1 + Math.floor(Math.random()*2); this.windows = 4 + Math.floor(Math.random()*4);
            }
            draw() {
                let sx = this.x - camera.x, sy = this.y - camera.y;
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(sx + 15, sy + this.height/2 + 10, this.width, this.height/2);

                // Walls texture
                let wallGrad = ctx.createLinearGradient(sx, sy, sx + this.width, sy + this.height);
                wallGrad.addColorStop(0, '#D2B48C'); wallGrad.addColorStop(0.5, '#A0522D'); wallGrad.addColorStop(1, '#8B4513');
                ctx.fillStyle = wallGrad;
                ctx.fillRect(sx, sy, this.width, this.height);

                // Roof
                ctx.fillStyle = '#4A4A4A';
                ctx.beginPath();
                ctx.moveTo(sx, sy - 20); ctx.lineTo(sx + this.width/2, sy - 50); ctx.lineTo(sx + this.width, sy - 20);
                ctx.fill();

                // Doors
                for(let i=0; i<this.doors; i++) {
                    ctx.fillStyle = '#654321'; ctx.fillRect(sx + 10 + i*35, sy + this.height - 40, 25, 40);
                    ctx.fillStyle = '#FFD700'; ctx.fillRect(sx + 15 + i*35, sy + this.height - 30, 15, 20);
                }

                // Windows glow (night)
                if (nightCycle > 0.5) {
                    ctx.shadowColor = '#FFFFAA'; ctx.shadowBlur = 15;
                    for(let i=0; i<this.windows; i++) {
                        let wx = sx + 20 + (i%2)*50, wy = sy + 20 + Math.floor(i/2)*30;
                        ctx.fillStyle = '#FFFF88'; ctx.fillRect(wx, wy, 20, 20);
                    }
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = '#87CEEB'; 
                    for(let i=0; i<this.windows; i++) {
                        let wx = sx + 20 + (i%2)*50, wy = sy + 20 + Math.floor(i/2)*30;
                        ctx.fillRect(wx, wy, 20, 20);
                    }
                }
            }
            collides(px, py, r) {
                return px > this.x - r && px < this.x + this.width + r && py > this.y - r && py < this.y + this.height + r;
            }
        }

        // Player ULTRA detailed
        class Player {
            constructor() {
                this.x = 1500; this.y = 1500; this.hp = 100; this.maxHp = 100;
                this.speed = 6; this.angle = 0; this.walkFrame = 0; this.bob = 0;
            }
            update() {
                let dx = 0, dy = 0;
                if (keys['w'] || keys['ArrowUp']) dy -= 1;
                if (keys['s'] || keys['ArrowDown']) dy += 1;
                if (keys['a'] || keys['ArrowLeft']) dx -= 1;
                if (keys['d'] || keys['ArrowRight']) dx += 1;
                let dist = Math.hypot(dx, dy);
                if (dist > 0) {
                    dx /= dist; dy /= dist;
                    this.x += dx * this.speed; this.y += dy * this.speed;
                    this.walkFrame += 0.3; this.bob += 0.2;
                }
                this.angle = Math.atan2(mouse.y - ch/2, mouse.x - cw/2);
                // Bobbing animation
                this.bob = Math.sin(this.walkFrame) * 2;
            }
            draw() {
                let px = cw/2, py = ch/2 + this.bob;
                ctx.save();
                ctx.translate(px, py);
                ctx.rotate(this.angle);

                // Legs detailed walk
                let legOffset = Math.sin(this.walkFrame * 2) * 5;
                let legGrad = ctx.createLinearGradient(0,0,0,25);
                legGrad.addColorStop(0,'#333'); legGrad.addColorStop(1,'#111');
                ctx.fillStyle = legGrad;
                ctx.fillRect(-10, 15 + legOffset, 8, 25);
                ctx.fillRect(2, 15 - legOffset, 8, 25);

                // Boots
                ctx.fillStyle = '#000';
                ctx.fillRect(-10, 38 + legOffset, 8, 8);
                ctx.fillRect(2, 38 - legOffset, 8, 8);

                // Body armor
                let bodyGrad = ctx.createLinearGradient(-18,-30,18,20);
                bodyGrad.addColorStop(0,'#00BFFF'); bodyGrad.addColorStop(0.5,'#1E90FF'); bodyGrad.addColorStop(1,'#4169E1');
                ctx.fillStyle = bodyGrad;
                ctx.fillRect(-18, -30, 36, 50);
                // Straps
                ctx.fillStyle = '#FFD700'; ctx.fillRect(-5, -25, 10, 40); ctx.fillRect(-18, -10, 36, 6);

                // Head detailed
                let headGrad = ctx.createRadialGradient(0,-40,0,0,-40,15);
                headGrad.addColorStop(0,'#FFE4B5'); headGrad.addColorStop(1,'#DEB887');
                ctx.fillStyle = headGrad;
                ctx.beginPath(); ctx.arc(0, -40, 15, 0, Math.PI*2); ctx.fill();
                // Eyes
                ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.arc(-6, -42, 3, 0, Math.PI*2); ctx.arc(6, -42, 3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-6, -42, 1.5, 0, Math.PI*2); ctx.arc(6, -42, 1.5, 0, Math.PI*2); ctx.fill();
                // Helmet
                ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -40, 18, 0, Math.PI*2); ctx.stroke();

                // Arms + hand
                ctx.fillStyle = '#00BFFF'; ctx.fillRect(-25, -15, 20, 12);
                ctx.fillStyle = '#DEB887'; ctx.beginPath(); ctx.arc(-20, -8, 6, 0, Math.PI*2); ctx.fill(); // Hand

                // Gun ULTRA
                let gun = weapons[currentWeapon];
                let gunLength = 50 + currentWeapon * 10;
                let gunGrad = ctx.createLinearGradient(20, -10, 20 + gunLength, -10);
                gunGrad.addColorStop(0, gun.color); gunGrad.addColorStop(0.7, '#444'); gunGrad.addColorStop(1, '#222');
                ctx.fillStyle = gunGrad; ctx.fillRect(20, -12, gunLength, 24);
                // Scope
                ctx.fillStyle = '#00FF00'; ctx.fillRect(25, -18, 15, 8);
                // Muzzle glow
                if (time % 10 < 2) {
                    ctx.shadowColor = '#FFFF00'; ctx.shadowBlur = 25;
                    ctx.fillStyle = '#FFFFAA'; ctx.fillRect(20 + gunLength, -6, 15, 12);
                    ctx.shadowBlur = 0;
                }

                ctx.restore();
            }
        }

        // Enemy types: Melee (zombie), Ranged (soldier)
        class Enemy {
            constructor(type = Math.random() < 0.7 ? 'melee' : 'ranged') {
                this.type = type;
                let angle = Math.random() * Math.PI * 2;
                let dist = 500 + Math.random() * 1000;
                this.x = player.x + Math.cos(angle) * dist;
                this.y = player.y + Math.sin(angle) * dist;
                this.size = 28; this.speed = type === 'melee' ? 2.5 : 1.8;
                this.hp = type === 'melee' ? 1.5 : 3; this.maxHp = this.hp;
                this.angle = 0; this.shootTimer = 0; this.walkFrame = 0;
                this.color = type === 'melee' ? '#8B0000' : '#FF4444';
            }
            update() {
                let dx = player.x - this.x, dy = player.y - this.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 0 && dist < (this.type === 'melee' ? 200 : 900)) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                    this.walkFrame += 0.25;
                }
                this.angle = Math.atan2(dy, dx);
                if (this.type === 'ranged') {
                    this.shootTimer++;
                    if (this.shootTimer > 90 + Math.random()*90) {
                        let vx = Math.cos(this.angle) * 12 + (Math.random()-0.5)*2;
                        let vy = Math.sin(this.angle) * 12 + (Math.random()-0.5)*2;
                        bullets.push(new Bullet(this.x, this.y, vx, vy, {dmg:12, color:'#FF6600'}));
                        this.shootTimer = 0;
                        playSound(200 + Math.random()*100, 'square', 0.1);
                    }
                }
            }
            draw() {
                let sx = this.x - camera.x, sy = this.y - camera.y + Math.sin(this.walkFrame)*1;
                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(this.angle);

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(-15, 20, 30, 12);

                if (this.type === 'melee') {
                    // Zombie: ragged clothes
                    ctx.fillStyle = this.color; ctx.fillRect(-15, -25, 30, 45);
                    ctx.fillStyle = '#663300'; ctx.fillRect(-12, 15, 24, 20); // Ragged pants
                    ctx.fillStyle = '#996600'; ctx.beginPath(); ctx.arc(0, -32, 12, 0, Math.PI*2); ctx.fill(); // Head decayed
                    ctx.fillStyle = '#FF0000'; ctx.beginPath(); ctx.arc(-4, -35, 2, 0, Math.PI*2); ctx.arc(4, -35, 2, 0, Math.PI*2); ctx.fill(); // Bloody eyes
                } else {
                    // Soldier similar to player but enemy
                    ctx.fillStyle = this.color; ctx.fillRect(-16, -28, 32, 48);
                    ctx.fillStyle = '#FF8888'; ctx.beginPath(); ctx.arc(0, -36, 13, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-5, -39, 2, 0, Math.PI*2); ctx.arc(5, -39, 2, 0, Math.PI*2); ctx.fill();
                }

                // Gun for ranged
                if (this.type === 'ranged') {
                    ctx.fillStyle = '#8B0000'; ctx.fillRect(22, -8, 35, 16);
                }

                ctx.restore();
            }
        }

        // Grenade
        class Grenade {
            constructor(x, y, vx, vy) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.life = 120; this.fuse = 90;
                this.exploded = false;
            }
            update() {
                this.x += this.vx; this.vy += 0.4; this.y += this.vy; this.vx *= 0.98;
                this.life--;
                if (this.life <= 0 && !this.exploded) {
                    this.explode();
                }
            }
            explode() {
                this.exploded = true;
                shake = 30;
                playSound(80, 'sine', 0.5, 0.4);
                for(let i=0; i<100; i++) {
                    particles.push(new Particle(this.x, this.y, (Math.random()-0.5)*15, (Math.random()-0.5)*15, 
                        ['#FF4444', '#FF8800', '#FFFF00'][Math.floor(Math.random()*3)], 6, 60, true, true, 0.02));
                }
                // Damage enemies around
                enemies.forEach((e, j) => {
                    if (Math.hypot(e.x - this.x, e.y - this.y) < 120) {
                        e.hp -= 50;
                        if (e.hp <= 0) {
                            killfeed.unshift(`${e.type.toUpperCase()} killed by Grenade!`); killfeed.length = Math.min(5, killfeed.length);
                            score += 30; enemies.splice(j, 1);
                        }
                    }
                });
            }
            draw() {
                let sx = this.x - camera.x, sy = this.y - camera.y;
                ctx.shadowColor = '#FF8800'; ctx.shadowBlur = 15;
                ctx.fillStyle = this.exploded ? '#FF4400' : '#008000';
                ctx.beginPath(); ctx.arc(sx, sy, 8, 0, Math.PI*2); ctx.fill();
                if (!this.exploded && this.life % 20 < 10) {
                    ctx.fillStyle = '#FF0000'; ctx.beginPath(); ctx.arc(sx + 3, sy - 3, 3, 0, Math.PI*2); ctx.fill();
                }
                ctx.shadowBlur = 0;
            }
        }

        // Bullet
        class Bullet {
            constructor(x, y, vx, vy, weapon) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                this.weapon = weapon; this.life = 120;
            }
            update() {
                this.x += this.vx; this.y += this.vy; this.life--;
                particles.push(new Particle(this.x, this.y, 0, 0, this.weapon.color + '80', 1.5, 8));
            }
            draw() {
                let sx = this.x - camera.x, sy = this.y - camera.y;
                ctx.shadowColor = this.weapon.color; ctx.shadowBlur = 12;
                ctx.fillStyle = this.weapon.color;
                ctx.beginPath(); ctx.arc(sx, sy, 3.5 + Math.random()*1, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Loot glow advanced
        class Loot {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type; this.bob = 0;
            }
            update() { this.bob += 0.1; }
            draw() {
                let sx = this.x - camera.x, sy = this.y - camera.y + Math.sin(this.bob)*5;
                ctx.shadowColor = '#00FFFF'; ctx.shadowBlur = 25;
                let color = this.type === 'hp' ? '#00FF88' : this.type === 'ammo' ? '#FFFF44' : '#FFAA00';
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.arc(sx, sy, 15, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#000'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.type[0].toUpperCase(), sx, sy);
            }
        }

        // Init map ULTRA
        function initMap() {
            trees = []; buildings = [];
            for (let i = 0; i < 400; i++) trees.push(new Tree(Math.random() * 3000, Math.random() * 3000));
            for (let i = 0; i < 80; i++) buildings.push(new Building(Math.random() * 3000 + 100, Math.random() * 3000 + 100));
        }

        class Camera {
            update() {
                this.x = player.x - cw / (2 * scale);
                this.y = player.y - ch / (2 * scale);
            }
        }

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            gameRunning = true;
            player = new Player();
            camera = new Camera();
            initMap();
            score = 0; currentWeapon = 0; ammoInMag = weapons[0].mag; mag = ammoInMag; grenadesLeft = 3;
            enemies = []; bullets = []; particles = []; loots = []; grenades = []; rain = []; killfeed = [];
            updateUI();
            loop();
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('hp').textContent = Math.floor(player.hp);
            document.getElementById('weaponName').textContent = weapons[currentWeapon].name;
            document.getElementById('bulletsLeft').textContent = ammoInMag;
            document.getElementById('magazine').textContent = mag;
            document.getElementById('weather').textContent = weather.charAt(0).toUpperCase() + weather.slice(1);
            // Killfeed
            let feedEl = document.getElementById('killfeed');
            feedEl.innerHTML = killfeed.map(k => `<div class="kill">${k}</div>`).join('');
        }

        // Controls + Grenade
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key.toLowerCase() === 'r' && grenadesLeft > 0 && gameRunning) {
                let angle = player.angle + (Math.random() - 0.5) * 0.2;
                let vx = Math.cos(angle) * 12 + (Math.random() - 0.5) * 4;
                let vy = Math.sin(angle) * 12 + (Math.random() - 0.5) * 4;
                grenades.push(new Grenade(player.x, player.y, vx, vy));
                grenadesLeft--;
                playSound(400, 'sine', 0.05);
            }
        });
        window.addEventListener('keyup', e => keys[e.key] = false);
        canvas.addEventListener('mousemove', e => {
            mouse.x = e.clientX; mouse.y = e.clientY;
        });
        canvas.addEventListener('mousedown', () => mouse.down = true);
        canvas.addEventListener('mouseup', () => mouse.down = false);
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // Auto shoot
        setInterval(() => { if (gameRunning && mouse.down) shoot(); }, 40);

        function shoot() {
            let now = Date.now();
            let w = weapons[currentWeapon];
            if (now - lastShot < w.rate || ammoInMag <= 0) return;
            lastShot = now; ammoInMag--;

            shake = w.recoil * 15;
            playSound(w.soundFreq, 'sawtooth', 0.15, 0.3, 100);

            let angle = player.angle + (Math.random() - 0.5) * (0.1 + w.recoil);
            let pellets = w.pellets || 1;
            for (let i = 0; i < pellets; i++) {
                let a = angle + (Math.random() - 0.5) * 0.15;
                let vx = Math.cos(a) * w.speed;
                let vy = Math.sin(a) * w.speed;
                bullets.push(new Bullet(player.x, player.y, vx, vy, w));
            }

            // Muzzle flash advanced
            for (let i = 0; i < 25; i++) {
                particles.push(new Particle(player.x + Math.cos(player.angle)*45, player.y + Math.sin(player.angle)*45,
                    (Math.random()-0.5)*12, (Math.random()-0.5)*12, '#FFFFFF', 4 + Math.random()*6, 25, true, true));
            }
        }

        function update() {
            if (!gameRunning) return;
            time++;

            // Night cycle
            nightCycle = Math.sin(time * 0.0005) * 0.5 + 0.5;
            // Weather change
            if (Math.random() < 0.0001) weather = ['sunny', 'rainy', 'foggy'][Math.floor(Math.random()*3)];

            player.update();

            // Collision trees + buildings
            [...trees, ...buildings].forEach(obs => {
                if (obs.collides(player.x, player.y, 30)) {
                    let dx = player.x - obs.x + (buildings.includes(obs) ? obs.width/2 : 0), dy = player.y - obs.y + (buildings.includes(obs) ? obs.height/2 : 0);
                    let dist = Math.hypot(dx, dy);
                    player.x = obs.x + (dx / dist) * (30 + (obs.size || Math.max(obs.width, obs.height)/2));
                    player.y = obs.y + (dy / dist) * (30 + (obs.size || Math.max(obs.width, obs.height)/2));
                }
            });

            camera.update();

            // Rain
            if (weather === 'rainy') {
                for(let i=0; i<5; i++) {
                    rain.push(new Particle(camera.x + Math.random()*cw/scale, camera.y, (Math.random()-0.5)*4 - 8, Math.random()*10 + 15, '#4A90E2', 1.5, 40, false, false, 0.6));
                }
            } else rain = [];

            // Spawn
            if (Math.random() < 0.018 + score / 12000) enemies.push(new Enemy());
            if (Math.random() < 0.006) loots.push(new Loot(Math.random()*3000, Math.random()*3000, ['hp','ammo','weapon'][Math.floor(Math.random()*3)]));

            // Update all
            enemies.forEach(e => e.update());
            loots.forEach(l => l.update());
            bullets.forEach(b => b.update());
            grenades.forEach(g => g.update());
            particles.forEach(p => p.update());
            rain.forEach(r => r.update());
            particles = particles.filter(p => p.life > 0);
            rain = rain.filter(r => r.life > 0 && r.y - camera.y < ch/scale);
            bullets = bullets.filter(b => b.life > 0);
            grenades = grenades.filter(g => g.life > 0 || g.exploded);

            // Bullet collisions
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < 28) {
                        e.hp -= b.weapon.dmg;
                        bullets.splice(i, 1);
                        // Blood + sparks
                        for (let k = 0; k < 35; k++) {
                            particles.push(new Particle(e.x, e.y, (Math.random()-0.5)*10, (Math.random()-0.5)*10, '#CC0000', 5, 50, true));
                        }
                        if (e.hp <= 0) {
                            killfeed.unshift(`You killed ${e.type}!`); killfeed.length = Math.min(10, killfeed.length);
                            score += e.type === 'melee' ? 20 : 40;
                            enemies.splice(j, 1);
                            if (Math.random() < 0.4) loots.push(new Loot(e.x, e.y, 'weapon'));
                        }
                        break;
                    }
                }
            }

            // Enemy collision
            enemies.forEach((e, i) => {
                if (Math.hypot(player.x - e.x, player.y - e.y) < 45) {
                    player.hp -= e.type === 'melee' ? 2.5 : 1.2;
                    enemies.splice(i, 1);
                    shake = 20;
                    for (let k = 0; k < 40; k++) particles.push(new Particle(player.x, player.y, (Math.random()-0.5)*8, (Math.random()-0.5)*8, '#FF0000', 7, 45));
                    if (player.hp <= 0) {
                        gameRunning = false;
                        alert(`ULTRA GAME OVER!\nScore kỷ lục: ${score}\nF5 để chiến lại! 💀`);
                        document.getElementById('menu').style.display = 'flex';
                        document.querySelector('#menu h1').textContent = `THỤT MẠNG: ${score}`;
                    }
                }
            });

            // Loot pickup
            loots.forEach((l, i) => {
                if (Math.hypot(player.x - l.x, player.y - l.y) < 70) {
                    if (l.type === 'weapon') currentWeapon = (currentWeapon + 1) % weapons.length;
                    if (l.type === 'hp') player.hp = Math.min(100, player.hp + 60);
                    if (l.type === 'ammo') { ammoInMag = mag = weapons[currentWeapon].mag; }
                    loots.splice(i, 1);
                    playSound(600, 'sine', 0.2);
                }
            });

            // Auto reload
            if (ammoInMag <= 0 && Math.random() < 0.15) {
                ammoInMag = mag;
                playSound(300, 'triangle', 0.3);
            }

            shake *= 0.92;
            updateUI();
        }

        function render() {
            ctx.save();
            ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

            // Sky ULTRA with night cycle
            let skyTop = nightCycle > 0.6 ? '#001122' : '#87CEEB';
            let skyBot = nightCycle > 0.6 ? '#000011' : '#98D8E8';
            let skyGrad = ctx.createLinearGradient(0, 0, 0, ch/scale);
            skyGrad.addColorStop(0, skyTop); skyGrad.addColorStop(0.3, nightCycle > 0.6 ? '#112244' : '#E0F6FF');
            skyGrad.addColorStop(0.7, skyBot); skyGrad.addColorStop(1, '#1e8449');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, cw/scale, ch/scale);

            // Stars at night
            if (nightCycle > 0.7) {
                ctx.fillStyle = '#FFFFFF';
                for(let i=0; i<200; i++) {
                    let sx = (i*37 - camera.x*0.1) % (cw/scale), sy = (i*53 - camera.y*0.1) % 200;
                    let size = Math.random() < 0.8 ? 1 : 2;
                    ctx.beginPath(); ctx.arc(sx, sy, size, 0, Math.PI*2); ctx.fill();
                }
            }

            // Clouds parallax enhanced
            ctx.fillStyle = nightCycle > 0.6 ? 'rgba(200,200,255,0.3)' : 'rgba(255,255,255,0.5)';
            for (let i = 0; i < 15; i++) {
                let cx = (time * 0.08 + i * 400 - camera.x * 0.4) % (cw/scale + 300) - 150;
                let cy = 120 + i * 60 - camera.y * 0.25;
                if (cy > 0 && cy < ch/scale) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, 50 + i%3*20, 0, Math.PI*2);
                    ctx.arc(cx+40, cy, 60, 0, Math.PI*2);
                    ctx.arc(cx+80, cy, 50, 0, Math.PI*2);
                    ctx.arc(cx+20, cy+30, 40, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // Fog enhanced
            let fogAlpha = nightCycle * 0.4 + (weather === 'foggy' ? 0.5 : 0);
            let fogGrad = ctx.createRadialGradient(player.x - camera.x, player.y - camera.y, 0, player.x - camera.x, player.y - camera.y, 1500);
            fogGrad.addColorStop(0, `rgba(0,100,50,0)`); fogGrad.addColorStop(0.6, `rgba(0,80,40,${fogAlpha})`); fogGrad.addColorStop(1, `rgba(0,60,30,${fogAlpha*1.5})`);
            ctx.fillStyle = fogGrad;
            ctx.fillRect(0, 0, cw/scale, ch/scale);

            // Grass detailed layers
            ctx.fillStyle = '#2d5a2d';
            ctx.fillRect(0, ch/scale * 0.6, cw/scale, ch/scale * 0.4);
            for (let layer = 0; layer < 3; layer++) {
                for (let i = 0; i < 300; i++) {
                    let gx = (i * 13.7 - camera.x * (0.1 + layer * 0.05)) % (cw/scale), gy = ch/scale - 50 - layer * 20;
                    ctx.fillStyle = `hsl(${90 + layer*10 + Math.random()*20}, 60%, ${25 + layer*10 + Math.random()*15}%)`;
                    ctx.beginPath();
                    ctx.moveTo(gx, gy);
                    ctx.lineTo(gx + (Math.random()-0.5)*10, gy - 40 - Math.random()*30);
                    ctx.lineTo(gx + (Math.random()-0.5)*15, gy);
                    ctx.fill();
                }
            }

            // Rain
            rain.forEach(r => r.draw());

            // Obstacles (buildings first for depth)
            buildings.forEach(b => {
                let dist = Math.hypot(b.x + b.width/2 - player.x, b.y + b.height/2 - player.y);
                if (dist < 1200) b.draw();
            });
            trees.forEach(t => {
                let dist = Math.hypot(t.x - player.x, t.y - player.y);
                if (dist < 1200) t.draw();
            });

            // Loots
            loots.forEach(l => l.draw());

            // Enemies
            enemies.forEach(e => e.draw());

            // Bullets + Grenades
            bullets.forEach(b => b.draw());
            grenades.forEach(g => g.draw());

            // Particles
            particles.forEach(p => p.draw());

            // Player
            player.draw();

            // Crosshair ULTRA
            let cx = cw/2, cy = ch/2;
            ctx.strokeStyle = nightCycle > 0.5 ? '#00FF88' : '#FFFFFF';
            ctx.lineWidth = 2; ctx.lineCap = 'round';
            ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(cx - 20, cy); ctx.lineTo(cx - 5, cy);
            ctx.moveTo(cx + 20, cy); ctx.lineTo(cx + 5, cy);
            ctx.moveTo(cx, cy - 20); ctx.lineTo(cx, cy - 5);
            ctx.moveTo(cx, cy + 20); ctx.lineTo(cx, cy + 5);
            ctx.stroke();
            // Center dot
            ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI*2); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
            ctx.shadowBlur = 0;

            // Vignette post-process
            let vignette = ctx.createRadialGradient(cw/2, ch/2, cw/3, cw/2, ch/2, cw);
            vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(0.7, 'rgba(0,0,0,0.3)'); vignette.addColorStop(1, 'rgba(0,0,0,0.7)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, cw/scale, ch/scale);

            ctx.restore();
        }

        function renderMinimap() {
            mctx.clearRect(0, 0, 150, 150);
            mctx.fillStyle = nightCycle > 0.6 ? '#112244' : '#1a4d1a';
            mctx.fillRect(0, 0, 150, 150);

            // Player
            mctx.fillStyle = '#00FFFF';
            mctx.beginPath();
            mctx.arc(75 + (player.x - 1500)/20, 75 + (player.y - 1500)/20, 5, 0, Math.PI*2);
            mctx.fill();

            // Enemies
            enemies.forEach(e => {
                mctx.fillStyle = e.type === 'melee' ? '#8B0000' : '#FF0000';
                mctx.beginPath();
                mctx.arc(75 + (e.x - 1500)/20, 75 + (e.y - 1500)/20, 3, 0, Math.PI*2);
                mctx.fill();
            });

            // Buildings/Trees simplified
            [...buildings, ...trees].forEach(obs => {
                let mx = 75 + ((obs.x || obs.x + obs.width/2) - 1500)/20;
                let my = 75 + ((obs.y || obs.y + obs.height/2) - 1500)/20;
                if (Math.hypot(mx-75, my-75) < 75) {
                    mctx.fillStyle = '#006400';
                    mctx.fillRect(mx-2, my-2, 4, 4);
                }
            });
        }

        function loop() {
            update();
            render();
            renderMinimap();
            requestAnimationFrame(loop);
        }
    </script>
</body>
